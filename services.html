<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدماتنا وأسعارنا | كورنر ووش</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* =========================================
           1. CSS Variables & Theme
           ========================================= */
        :root {
            --primary-orange: #ea6420;
            --primary-glow: rgba(234, 100, 32, 0.4);
            --dark-bg: #050505;
            --darker-bg: #000000;
            --text-light: #f4f4f4;
            --text-muted: #aaaaaa;
            --glass-border: rgba(255, 255, 255, 0.05);
            --glass-bg: rgba(255, 255, 255, 0.03);
        }

        /* =========================================
           2. Base Reset & Typography
           ========================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--dark-bg); color: var(--text-light); line-height: 1.6; }
        h1, h3 { font-weight: 900; }

        /* =========================================
           3. Utilities (Glassmorphism, Reveals)
           ========================================= */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        /* Page Header */
        .page-header { text-align: center; padding: 80px 20px 60px; position: relative; background: url('images/bg-luxury.jpg') center/cover fixed, url('images/bg-luxury.png') center/cover fixed, var(--dark-bg); margin-bottom: 50px; border-bottom: 1px solid var(--glass-border); }
        .page-header::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.8), var(--dark-bg)); }
        .page-header-content { position: relative; z-index: 2; }
        .page-header h1 { color: #fff; font-size: 2.8rem; margin-bottom: 15px; text-shadow: 0 0 20px rgba(234,100,32,0.3); }
        .page-header h1 i { color: var(--primary-orange); margin-left: 10px; }
        
        /* Back Button */
        .back-btn { display: inline-flex; align-items: center; gap: 10px; background: var(--glass-bg); backdrop-filter: blur(10px); color: #fff; text-decoration: none; padding: 12px 25px; border-radius: 50px; font-weight: 700; transition: 0.3s; border: 1px solid var(--glass-border); margin-top: 20px; }
        .back-btn:hover { background: var(--primary-orange); border-color: var(--primary-orange); transform: translateX(5px); box-shadow: 0 0 15px var(--primary-glow); }

        /* =========================================
           4. Luxury Cards Grid
           ========================================= */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; padding-bottom: 80px; }
        
        .service-card { background: var(--glass-bg); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 40px 30px; text-align: center; transition: all 0.4s ease; position: relative; overflow: hidden; display: flex; flex-direction: column; height: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .service-card::before { content: ''; position: absolute; top: 0; right: 0; width: 100%; height: 4px; background: var(--primary-orange); transform: scaleX(0); transform-origin: right; transition: transform 0.4s ease; }
        .service-card:hover::before { transform: scaleX(1); }
        .service-card:hover { transform: translateY(-10px); border-color: rgba(234, 100, 32, 0.4); box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 25px rgba(234,100,32,0.15); }
        
        .card-icon { width: 80px; height: 80px; margin: 0 auto 25px; background: linear-gradient(135deg, rgba(234,100,32,0.15), transparent); border: 1px solid var(--primary-orange); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--primary-orange); transition: 0.5s; box-shadow: inset 0 0 15px var(--primary-glow); }
        .service-card:hover .card-icon { transform: rotateY(180deg); background: var(--primary-orange); color: #fff; }

        .service-name { font-size: 1.5rem; color: #fff; margin-bottom: 15px; }
        .service-desc { color: var(--text-muted); font-size: 1.05rem; flex-grow: 1; margin-bottom: 30px; line-height: 1.7; }
        .service-price { font-size: 2.2rem; font-weight: 900; color: var(--primary-orange); border-top: 1px solid var(--glass-border); padding-top: 25px; text-shadow: 0 0 10px rgba(234,100,32,0.2); }
        .service-price span { font-size: 1.1rem; color: #888; font-weight: 600; margin-right: 5px; }

        /* Loading Message Styles */
        #loadingMsg { text-align: center; color: var(--primary-orange); padding: 60px 20px; font-size: 1.4rem; display: flex; flex-direction: column; align-items: center; gap: 20px; font-weight: bold; }
        #loadingMsg i { font-size: 3rem; filter: drop-shadow(0 0 10px var(--primary-glow)); }

        /* Responsive */
        @media (max-width: 768px) { 
            .page-header h1 { font-size: 2.2rem; }
            .services-grid { gap: 20px; }
        }
    </style>
</head>
<body>

    <div class="page-header">
        <div class="container page-header-content reveal">
            <h1><i class="fas fa-gem"></i> باقات الخدمات والأسعار</h1>
            <p style="color: #aaa; font-size: 1.1rem; max-width: 600px; margin: 0 auto;">اختر الباقة التي تناسب سيارتك واستمتع بتجربة رفاهية وعناية فائقة الجودة.</p>
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-right"></i> العودة للرئيسية
            </a>
        </div>
    </div>

    <div class="container">
        <div id="loadingMsg">
            <i class="fas fa-spinner fa-spin"></i> 
            جاري تجهيز الباقات الفاخرة...
        </div>
        
        <!-- سيتم استبدال الجدول بالـ Grid للـ Luxury Cards -->
        <div id="servicesGrid" class="services-grid" style="display: none;">
            <!-- سيتم إضافة البطاقات هنا عبر الجافاسكربت -->
        </div>
    </div>

    <!-- كود جلب البيانات من Supabase -->
    <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabaseUrl = 'https://vruesnomrftsgfnrhedw.supabase.co';
    const supabaseKey = 'sb_publishable_2_baJv89Ydrv0BzMgHB1YQ_EZHcB9jK'; 

    const supabase = createClient(supabaseUrl, supabaseKey);

    const servicesGrid = document.getElementById('servicesGrid');
    const loadingMsg = document.getElementById('loadingMsg');

    async function fetchServices() {
        try {
            const { data, error } = await supabase
                .from('services')
                .select('service_name, service_description, service_price')
                .order('id', { ascending: true });

            if (error) throw error;

            if (!data || data.length === 0) {
                loadingMsg.innerHTML = 'لا توجد خدمات متاحة حالياً.';
                return;
            }

            servicesGrid.innerHTML = '';
            
            // مجموعة أيقونات فاخرة لتوزيعها على البطاقات
            const icons = ['fa-car-side', 'fa-spray-can-sparkles', 'fa-droplet', 'fa-car-burst', 'fa-shield-halved', 'fa-star'];

            data.forEach((service, index) => {
                const icon = icons[index % icons.length];
                const card = document.createElement('div');
                card.className = 'service-card reveal';

                // إنشاء العناصر بأمان لتجنب XSS
                const cardIconContainer = document.createElement('div');
                cardIconContainer.className = 'card-icon';
                const cardIcon = document.createElement('i');
                cardIcon.className = `fas ${icon}`;
                cardIconContainer.appendChild(cardIcon);

                const serviceName = document.createElement('h3');
                serviceName.className = 'service-name';
                serviceName.textContent = service.service_name; // Use textContent for safety

                const serviceDesc = document.createElement('p');
                serviceDesc.className = 'service-desc';
                serviceDesc.textContent = service.service_description; // Use textContent for safety

                const servicePrice = document.createElement('div');
                servicePrice.className = 'service-price';
                servicePrice.textContent = service.service_price; // Use textContent for safety

                const currencySpan = document.createElement('span');
                currencySpan.textContent = ' ج.م';
                servicePrice.appendChild(currencySpan);

                card.append(cardIconContainer, serviceName, serviceDesc, servicePrice);
                servicesGrid.appendChild(card);
            });

            loadingMsg.style.display = 'none';
            servicesGrid.style.display = 'grid';

            // تفعيل الـ Animations للبطاقات المضافة
            setTimeout(() => {
                document.querySelectorAll('.service-card.reveal').forEach(el => el.classList.add('active'));
            }, 100);

        } catch (error) {
            console.error('Error fetching data:', error);
            loadingMsg.innerHTML = `
                <i class="fas fa-exclamation-triangle" style="color: #dc3545; font-size: 3rem; margin-bottom: 15px;"></i>
                <div style="color: #fff; font-size: 1.2rem;">عذراً، تعذر تحميل الباقات. يرجى التحقق من اتصالك بالإنترنت أو المحاولة لاحقاً.</div>
            `;
        }
    }

    window.addEventListener('DOMContentLoaded', fetchServices);
</script>
<script>
    // مؤقت احتياطي (Fallback): إذا فشل تحميل مكتبة Supabase أو انقطع الإنترنت تماماً
    setTimeout(() => {
        const grid = document.getElementById('servicesGrid');
        const loader = document.getElementById('loadingMsg');
        // إذا استمر عرض التحميل لأكثر من 8 ثوان ولم يظهر الجدول، نعرض رسالة فشل الاتصال
        if (grid && grid.style.display === 'none' && loader && loader.innerHTML.includes('fa-spinner')) {
            loader.innerHTML = `
                <i class="fas fa-wifi" style="color: #dc3545; font-size: 3rem; margin-bottom: 15px;"></i>
                <div style="color: #fff; font-size: 1.2rem;">يبدو أن هناك مشكلة في الاتصال. يرجى تحديث الصفحة والمحاولة من جديد.</div>
            `;
        }
    }, 8000);

    // تأثيرات الدخول عند التحميل والنزول لأسفل
    document.addEventListener("DOMContentLoaded", function() {
        setTimeout(() => {
            document.querySelectorAll('.page-header-content.reveal').forEach(el => el.classList.add('active'));
        }, 150);
    });
</script>
</body>
</html>
