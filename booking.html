<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد | كورنر ووش</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- استدعاء Supabase بالطريقة الكلاسيكية التي لا تسبب أخطاء في الملفات المحلية -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --primary-orange: #ea6420; --dark-black: #1a1a1a; --bg-light: #fef8f5; --white: #ffffff; --gray: #e0e0e0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-light); color: var(--dark-black); padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .back-btn { display: inline-block; background-color: var(--dark-black); color: var(--white); text-decoration: none; padding: 10px 20px; border-radius: 8px; margin-bottom: 20px; }
        .form-container { background: var(--white); border-radius: 15px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid var(--primary-orange); }
        .form-container h1 { color: var(--primary-orange); text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; text-align: right; }
        .form-control { width: 100%; padding: 12px; border: 1px solid var(--gray); border-radius: 8px; font-size: 1rem; }
        .form-control:focus { outline: none; border-color: var(--primary-orange); }
        
        #timeSection { display: none; margin-top: 25px; padding-top: 20px; border-top: 1px dashed var(--gray); }
        .times-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 15px; }
        .time-box { background-color: var(--white); border: 2px solid var(--gray); border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; font-weight: 700; transition: 0.3s; }
        .time-box:hover:not(.disabled) { border-color: var(--primary-orange); color: var(--primary-orange); }
        .time-box.selected { background-color: var(--primary-orange); color: var(--white); border-color: var(--primary-orange); }
        .time-box.disabled { background-color: #f5f5f5; color: #aaa; border-color: #eee; cursor: not-allowed; text-decoration: line-through; }
        
        .loading { text-align: center; display: none; color: var(--primary-orange); font-weight: bold; margin-bottom: 10px; }
        .submit-btn { background-color: var(--primary-orange); color: var(--white); border: none; padding: 15px; font-size: 1.2rem; font-weight: 800; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 20px; }
        .submit-btn:disabled { background-color: #aaa; cursor: not-allowed; }
        .alert { display: none; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center; font-weight: bold; }
        .alert-success { background-color: #d4edda; color: #155724; }
        .alert-error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-right"></i> عودة للرئيسية</a>
        <div class="form-container">
            <h1><i class="fas fa-calendar-check"></i> طلب حجز موعد</h1>
            <form id="bookingForm">
                <div class="form-group">
                    <label>الاسم <span>*</span></label>
                    <input type="text" id="customerName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>رقم الموبايل <span>*</span></label>
                    <input type="tel" id="phoneNumber" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>نوع السيارة <span>*</span></label>
                    <input type="text" id="carType" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>تاريخ الحجز <span>*</span></label>
                    <small>الرجاء اختيار التاريخ لعرض المواعيد المتاحة</small>
                    <!-- حقل التاريخ -->
                    <input type="date" id="bookingDate" class="form-control" required>
                </div>
                
                <div id="timeSection">
                    <div class="form-group">
                        <label>اختر وقت الحضور <span>*</span></label>
                        <div id="loadingTimes" class="loading"><i class="fas fa-spinner fa-spin"></i> جاري فحص المواعيد المتاحة...</div>
                        <div id="timesGrid" class="times-grid"></div>
                    </div>
                    <button type="submit" id="submitBtn" class="submit-btn" disabled>تأكيد الحجز</button>
                </div>
            </form>
            <div id="successAlert" class="alert alert-success">تم ارسال طلب الحجز وسيتم التواصل معكم قريباً.</div>
            <div id="errorAlert" class="alert alert-error"></div>
        </div>
    </div>

    <!-- كود الجافاسكريبت -->
    <script>
        // ==========================================
        // 1. واجهة المستخدم والتاريخ (يعمل فوراً)
        // ==========================================
        const dateInput = document.getElementById('bookingDate');
        const timeSection = document.getElementById('timeSection');
        const timesGrid = document.getElementById('timesGrid');
        const submitBtn = document.getElementById('submitBtn');
        const loadingTimes = document.getElementById('loadingTimes');
        const errorAlert = document.getElementById('errorAlert');
        let selectedTime = null;

        // حساب تاريخ اليوم وصيغته بدقة
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        const todayString = `${year}-${month}-${day}`;
        
        // تعطيل الأيام السابقة في الرزنامة فوراً
        dateInput.setAttribute('min', todayString);

        // منع اللصق اليدوي لتاريخ قديم
        dateInput.addEventListener('input', function() {
            if (this.value && this.value < todayString) {
                this.value = todayString;
            }
        });

        // ==========================================
        // 2. إعداد قاعدة بيانات Supabase
        // ==========================================
        // تنبيه: ضع الروابط الخاصة بك هنا، وإلا فلن تظهر الساعات!
        const supabaseUrl = 'https://vruesnomrftsgfnrhedw.supabase.co';
        const supabaseKey = 'sb_publishable_2_baJv89Ydrv0BzMgHB1YQ_EZHcB9jK';
        
        let supabaseClient;
        try {
            // استخدام المكتبة التي تم استدعاؤها في أعلى الصفحة
            supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        } catch (e) {
            console.error("لم يتم العثور على روابط Supabase الصحيحة", e);
            errorAlert.innerText = "يرجى وضع روابط Supabase الصحيحة في الكود لكي تعمل الصفحة.";
            errorAlert.style.display = 'block';
        }

        const timeSlots = [
            { display: '12:00 م', value: '12:00:00' }, { display: '1:00 م', value: '13:00:00' },
            { display: '2:00 م', value: '14:00:00' }, { display: '3:00 م', value: '15:00:00' },
            { display: '4:00 م', value: '16:00:00' }, { display: '5:00 م', value: '17:00:00' },
            { display: '6:00 م', value: '18:00:00' }, { display: '7:00 م', value: '19:00:00' },
            { display: '8:00 م', value: '20:00:00' }, { display: '9:00 م', value: '21:00:00' },
            { display: '10:00 م', value: '22:00:00' }, { display: '11:00 م', value: '23:00:00' }
        ];

        // ==========================================
        // 3. عرض الساعات عند تغيير التاريخ
        // ==========================================
        dateInput.addEventListener('change', async () => {
            selectedTime = null;
            submitBtn.disabled = true;
            timesGrid.innerHTML = '';
            errorAlert.style.display = 'none';
            document.getElementById('successAlert').style.display = 'none';
            
            const selectedDate = dateInput.value;
            if (!selectedDate || selectedDate < todayString) {
                timeSection.style.display = 'none';
                return;
            }

            // إظهار قسم الوقت وعلامة التحميل
            timeSection.style.display = 'block';
            loadingTimes.style.display = 'block';

            if (!supabaseClient) {
                loadingTimes.style.display = 'none';
                return; // إذا لم تكن الروابط صحيحة، أوقف العملية هنا
            }

            try {
                // جلب الحجوزات
                const { data: bookings, error: err1 } = await supabaseClient.from('bookings').select('booking_time').eq('booking_date', selectedDate);
                if (err1) throw err1;

                // جلب الأوقات المغلقة
                const { data: blocked, error: err2 } = await supabaseClient.from('blocked_slots').select('blocked_time').eq('blocked_date', selectedDate);
                if (err2) throw err2;

                const bookingCounts = {};
                if (bookings) {
                    bookings.forEach(b => {
                        bookingCounts[b.booking_time] = (bookingCounts[b.booking_time] || 0) + 1;
                    });
                }
                const blockedTimes = blocked ? blocked.map(b => b.blocked_time) : [];

                timeSlots.forEach(slot => {
                    const box = document.createElement('div');
                    box.className = 'time-box';
                    box.innerText = slot.display;

                    if (blockedTimes.includes(slot.value) || (bookingCounts[slot.value] >= 2)) {
                        box.classList.add('disabled');
                        box.innerText += ' (غير متاح)';
                    } else {
                        box.addEventListener('click', () => {
                            document.querySelectorAll('.time-box').forEach(b => b.classList.remove('selected'));
                            box.classList.add('selected');
                            selectedTime = slot.value;
                            submitBtn.disabled = false;
                        });
                    }
                    timesGrid.appendChild(box);
                });
            } catch (err) {
                console.error(err);
                errorAlert.innerText = "حدث خطأ أثناء جلب المواعيد. تأكد من إعدادات قاعدة البيانات وجدول blocked_slots.";
                errorAlert.style.display = 'block';
                timeSection.style.display = 'none';
            } finally {
                loadingTimes.style.display = 'none';
            }
        });

        // ==========================================
        // 4. إرسال الفورم للحجز
        // ==========================================
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!selectedTime || !supabaseClient) return;
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'جاري الإرسال...';
            
            const payload = {
                customer_name: document.getElementById('customerName').value,
                phone_number: document.getElementById('phoneNumber').value,
                car_type: document.getElementById('carType').value,
                booking_date: dateInput.value,
                booking_time: selectedTime
            };

            const { error } = await supabaseClient.from('bookings').insert([payload]);

            if (error) {
                errorAlert.innerText = 'حدث خطأ أثناء إرسال طلبك. يرجى المحاولة مرة أخرى.';
                errorAlert.style.display = 'block';
                submitBtn.disabled = false;
            } else {
                document.getElementById('successAlert').style.display = 'block';
                document.getElementById('bookingForm').reset();
                timeSection.style.display = 'none';
                dateInput.setAttribute('min', todayString);
            }
            submitBtn.innerText = 'تأكيد الحجز';
        });
    </script>
</body>
</html>
